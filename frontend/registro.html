<!DOCTYPE html>
<html lang="es-GT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta – Detalles Eternos GT</title>
<meta name="description" content="Crea tu cuenta gratis para comprar en línea y acumular puntos.">
<meta name="theme-color" content="#C2185B">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<script src="js/config.js" defer></script>
<script src="js/datos-demo.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/paginas/registro.js" defer></script>
</head>
<body data-pagina="registro">
<main id="contenido" class="contenedor">
  <div class="caja-auth">
    <div class="tarjeta">
      <h1>Crea tu cuenta</h1>
      <p class="texto-gris">Es gratis. Compra más rápido, sigue tus pedidos y acumula puntos.</p>
      <div class="franja-huipil franja-huipil--fina" aria-hidden="true" style="margin:14px 0 18px"></div>
      <div id="aviso" role="alert"></div>
      <form id="form-registro" class="formulario" novalidate>
        <div class="campo"><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" autocomplete="name" required maxlength="120"><p class="error" id="error-nombre"></p></div>
        <div class="campo"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required><p class="error" id="error-email"></p></div>
        <div class="campo"><label for="telefono">Teléfono (WhatsApp)</label><input id="telefono" name="telefono" type="tel" autocomplete="tel" inputmode="tel" placeholder="5555-1234" required><p class="ayuda">Te avisaremos por aquí del estado de tus pedidos.</p><p class="error" id="error-telefono"></p></div>
        <div class="campo"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="ayuda-clave"><p class="ayuda" id="ayuda-clave">Mínimo 8 caracteres.</p><p class="error" id="error-password"></p></div>
        <div class="campo"><label for="password2">Repite la contraseña</label><input id="password2" name="password2" type="password" autocomplete="new-password" required><p class="error" id="error-password2"></p></div>
        <label class="casilla"><input type="checkbox" name="mayorista" id="mayorista"><span><strong>Tengo un negocio y quiero comprar por mayor</strong><br><span class="texto-gris">Revisaremos tu solicitud para activar los precios mayoristas.</span></span></label>
        <button class="btn btn-primario btn-bloque" type="submit" id="crear">Crear mi cuenta</button>
      </form>
      <p class="separador">¿Ya tienes cuenta? <a href="login.html" id="ir-login" style="font-weight:800;color:var(--anil)">Inicia sesión</a></p>
    </div>
  </div>
</main>
</body>
</html>
