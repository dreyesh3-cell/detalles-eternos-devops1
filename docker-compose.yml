# Proyecto DEVOPS 1 - Arquitectura de microservicios
# Uso:  cp .env.example .env  &&  docker compose up -d --build
name: devops1

x-servicio-base: &servicio-base
  restart: unless-stopped
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ------------------ Infraestructura ------------------
  postgres:
    image: postgres:16-alpine
    container_name: devops1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops123}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devops1-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis123}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------ Microservicios ------------------
  auth:
    <<: *servicio-base
    build:
      context: ./backend/ApiAuth
      dockerfile: Dockerfile
    image: devops1/auth:latest
    container_name: devops1-auth
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8001
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=auth_db;Username=${POSTGRES_USER:-devops};Password=${POSTGRES_PASSWORD:-devops123}
      Jwt__Key: ${JWT_KEY:-DetallesEternosGT-ApiAuth-SecretKey-2026-MuySegura-123456789}
      Jwt__Issuer: ApiAuth
    ports:
      - "8001:8001"

  catalogo:
    <<: *servicio-base
    build:
      context: ./backend/ApiCatalogo
      dockerfile: Dockerfile
    image: devops1/catalogo:latest
    container_name: devops1-catalogo
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8002
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=catalogo_db;Username=${POSTGRES_USER:-devops};Password=${POSTGRES_PASSWORD:-devops123}
    ports:
      - "8002:8002"
    volumes:
      - catalogo_uploads:/app/uploads

  pedidos:
    <<: *servicio-base
    build:
      context: ./backend/ApiPedidos
      dockerfile: Dockerfile
    image: devops1/pedidos:latest
    container_name: devops1-pedidos
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8003
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=pedidos_db;Username=${POSTGRES_USER:-devops};Password=${POSTGRES_PASSWORD:-devops123}
      ConnectionStrings__CatalogoConnection: Host=postgres;Port=5432;Database=catalogo_db;Username=${POSTGRES_USER:-devops};Password=${POSTGRES_PASSWORD:-devops123}
      ConnectionStrings__AuthConnection: Host=postgres;Port=5432;Database=auth_db;Username=${POSTGRES_USER:-devops};Password=${POSTGRES_PASSWORD:-devops123}
      Jwt__Issuer: ApiAuth
      Jwt__Key: ${JWT_KEY}
    ports:
      - "8003:8003"

  pagos:
    <<: *servicio-base
    build:
      context: ./backend/ApiPagos
      dockerfile: Dockerfile
    image: devops1/pagos:latest
    container_name: devops1-pagos
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8004
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=pagos_db;Username=${POSTGRES_USER:-devops};Password=${POSTGRES_PASSWORD:-devops123}
      ConnectionStrings__PedidosConnection: Host=postgres;Port=5432;Database=pedidos_db;Username=${POSTGRES_USER:-devops};Password=${POSTGRES_PASSWORD:-devops123}
    ports:
      - "8004:8004"

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  catalogo_uploads:
